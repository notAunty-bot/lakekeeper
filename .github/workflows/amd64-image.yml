name: amd64 image (cutover)

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lakekeeper-amd64
  cancel-in-progress: false

env:
  TAG: "0.15.0-rc1"
  IMAGE: ghcr.io/notaunty-bot/lakekeeper

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: v0.15.0-rc1
          persist-credentials: false

      - name: Free disk space (build is ~14 GB peak)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          docker-images: false
          large-packages: false

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build linux/amd64 image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg NO_CHEF=true \
            --platform linux/amd64 \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:$TAG-amd64" \
            -f docker/full.Dockerfile .

      - name: Verify and push
        run: |
          docker image inspect "$IMAGE:$TAG" --format '{{ .Os }}/{{ .Architecture }}' | tee /tmp/arch.txt
          grep -q 'linux/amd64' /tmp/arch.txt || { echo "not amd64"; exit 1; }
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG-amd64"
